<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hot Potato Music Game</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#fff3dc;color:#39210c;text-align:center;margin:0;padding:30px 16px}
main{max-width:480px;margin:auto}h1{font-size:2.5rem}button{font-size:1.5rem;padding:18px 28px;border:0;border-radius:16px;background:#d95522;color:white;font-weight:bold;margin:12px;cursor:pointer}
button:disabled{opacity:.45}input{font-size:1rem;max-width:100%}.controls{background:white;border-radius:20px;padding:20px;margin-top:20px}
label{display:block;margin:14px 0}input[type=number]{width:70px;padding:8px;font-size:1.1rem}
#status{font-size:2rem;font-weight:800;min-height:3rem}small{display:block;line-height:1.5}
</style></head>
<body><main><h1>🥔 Hot Potato!</h1><p>Pick a song, pass the potato, and wait for the surprise stop!</p>
<div class="controls">
<label>Choose music from your device<br><input id="file" type="file"></label>
<label>Minimum seconds <input id="min" type="number" min="2" max="600" value="10"></label>
<label>Maximum seconds <input id="max" type="number" min="2" max="600" value="30"></label>
<div id="status" role="status" aria-live="polite">Choose a song</div>
<button id="start" disabled>▶ START</button><button id="stop" disabled>■ STOP</button>
<small>Each round stops at a random time. The timer stays hidden so nobody gets a clue. Keep Chrome open and your screen awake while playing.</small>
</div><audio id="audio" preload="auto"></audio></main>
<script>
const file=document.getElementById('file'),audio=document.getElementById('audio'),start=document.getElementById('start'),stop=document.getElementById('stop'),status=document.getElementById('status');
let timer=null,url=null;
function reset(){clearTimeout(timer);timer=null;audio.pause();start.disabled=!url;stop.disabled=true;}
file.addEventListener('change',()=>{reset();if(url)URL.revokeObjectURL(url);url=file.files[0]?URL.createObjectURL(file.files[0]):null;audio.src=url||'';status.textContent=url?'Ready to play!':'Choose a song';});
start.addEventListener('click',async()=>{
if(!url)return;
const min=Number(document.getElementById('min').value),max=Number(document.getElementById('max').value);
if(!Number.isFinite(min)||!Number.isFinite(max)||min<2||max<min||max>600){status.textContent='Check your time range (2–600 seconds).';return;}
reset();audio.currentTime=0;audio.loop=true;
try{await audio.play();}catch(e){status.textContent='Unable to play this file. Try another song.';return;}
status.textContent='🎶 PASS IT!';start.disabled=true;stop.disabled=false;
const seconds=min+Math.random()*(max-min);
timer=setTimeout(()=>{reset();status.textContent='🛑 STOP! Who has the potato?';},seconds*1000);
});
stop.addEventListener('click',()=>{reset();status.textContent='Stopped. Ready for another round!';});
</script></body></html>
