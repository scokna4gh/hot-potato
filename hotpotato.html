<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hot Potato Game</title>
<link rel="apple-touch-icon" href="hotpotato.png">
<link rel="icon" type="image/png" href="hotpotato.png">

<style>
body {
  font-family: system-ui,-apple-system,sans-serif;
  background: #fff3dc;
  color: #39210c;
  text-align: center;
  margin: 0;
  padding: 30px 16px;
}

main { max-width: 480px; margin: auto; }

button {
  font-size: 1.5rem;
  padding: 18px 28px;
  border: 0;
  border-radius: 16px;
  background: #d95522;
  color: white;
  font-weight: bold;
  margin: 12px;
  cursor: pointer;
}

button:disabled { opacity: .45; }
button[hidden] { display: none; }

.controls {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin-top: 20px;
}

label { display: block; margin: 14px 0; }

input[type=number] {
  width: 70px;
  padding: 8px;
  font-size: 1.1rem;
}

/* Custom music selection controls */
#file { display: none; }

#chooseMusic {
  font-size: 1.1rem;
  padding: 14px 22px;
  margin: 8px 0;
}

#filename {
  font-size: .95rem;
  margin: 6px 0 12px;
  overflow-wrap: anywhere;
}

#default {
  font-size: 1rem;
  padding: 12px 18px;
  background: #82613d;
  margin: 4px 0 12px;
}

#status {
  font-size: 2rem;
  font-weight: 800;
  min-height: 3rem;
  margin: 18px 0;
}

small { display: block; line-height: 1.5; }
</style>
</head>

<body>
<main>

<img src="hotpotato.png" alt="Hot Potato!"
     style="width:160px;height:160px;border-radius:24px;">

<p>Start the music, pass the potato, and wait for the music to stop!</p>

<div class="controls">

<!-- Music selection -->
<button id="chooseMusic" type="button">♫ Choose Music</button>

<input id="file" type="file"
       accept=".mp3,.m4a,.aac,.wav,.ogg,.flac">

<div id="filename">Default music selected</div>

<button id="default" type="button" hidden>
  ♫ Use Default Music
</button>

<!-- Random stop settings -->
<label>
  Minimum seconds
  <input id="min" type="number" step="1" min="5" max="300" value="10">
</label>

<label>
  Maximum seconds
  <input id="max" type="number" step="1" min="5" max="300" value="30">
</label>

<div id="status" role="status" aria-live="polite">
  Ready to play!
</div>

<button id="start" type="button">▶ START</button>
<button id="stop" type="button" disabled>■ STOP</button>

<small>
Each round stops at a random time. The timer stays hidden
so nobody gets a clue. Keep the game open and your screen
awake while playing.
</small>

</div>

<audio id="audio" preload="auto" loop></audio>
</main>

<script>
const file = document.getElementById('file');
const audio = document.getElementById('audio');
const start = document.getElementById('start');
const stop = document.getElementById('stop');
const chooseMusic = document.getElementById('chooseMusic');
const defaultButton = document.getElementById('default');
const filename = document.getElementById('filename');
const status = document.getElementById('status');

const defaultSong = 'hotpotato.mp3';

let timer = null;
let url = null;
let playing = false;
let session = 0;

// Load the built-in soundtrack.
audio.src = defaultSong;
audio.loop = true;

// Stop without resetting playback position.
function reset() {
  session++;
  clearTimeout(timer);
  timer = null;
  audio.pause();
  playing = false;
  start.disabled = false;
  stop.disabled = true;
}

// Open the device's file picker.
chooseMusic.addEventListener('click', () => {
  file.click();
});

// Select a personal music file.
file.addEventListener('change', () => {
  if (!file.files.length) return;

  reset();

  if (url) URL.revokeObjectURL(url);

  url = URL.createObjectURL(file.files[0]);
  audio.src = url;
  audio.load();

  filename.textContent = file.files[0].name;
  defaultButton.hidden = false;

  status.textContent = 'Ready to play!';
});

// Restore the built-in soundtrack.
defaultButton.addEventListener('click', () => {
  reset();

  if (url) {
    URL.revokeObjectURL(url);
    url = null;
  }

  file.value = '';
  audio.src = defaultSong;
  audio.load();

  filename.textContent = 'Default music selected';
  defaultButton.hidden = true;

  status.textContent = 'Ready to play!';
});

// Start a new round.
start.addEventListener('click', async () => {
  if (playing || start.disabled) return;

  const min = Number(document.getElementById('min').value);
  const max = Number(document.getElementById('max').value);

  if (
    !Number.isInteger(min) ||
    !Number.isInteger(max) ||
    min < 5 ||
    max < min ||
    max > 300
  ) {
    status.innerHTML = 'Please enter whole numbers<br>from 5 – 300 seconds.';
    return;
  }

  reset();
  const currentSession = session;

  start.disabled = true;

  try {
    await audio.play();
  } catch (e) {
    if (currentSession !== session) return;
    start.disabled = false;
    status.innerHTML =
      'Unable to play this song.<br>Try choosing another file.';
    return;
  }

  if (currentSession !== session) return;

  playing = true;
  status.textContent = '🎶 PASS IT!';
  stop.disabled = false;

  const seconds = min + Math.random() * (max - min);

  timer = setTimeout(() => {
    if (currentSession !== session) return;

    reset();
    status.innerHTML = '🛑 STOP!<br>Who has the potato?';
  }, seconds * 1000);
});

// Manually stop a round.
stop.addEventListener('click', () => {
  reset();
  status.innerHTML = 'Stopped.<br>Tap START for another round!';
});
</script>
</body>
</html>
